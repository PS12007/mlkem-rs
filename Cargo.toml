[workspace]
resolver = "3"
members = ["crates/mlkem", "crates/dudect"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PS12007/mlkem-rs"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Index loops (`for i in 0..128`) are kept on purpose: they mirror the FIPS
# 203 pseudocode line by line, which makes review against the standard easier.
needless_range_loop = "allow"

# The arithmetic tests are exhaustive (they try every possible input, about
# 2^28 values for Montgomery reduction). opt-level 2 makes that take seconds
# instead of minutes. Overflow checks stay ON in the test profile, so any
# i16/i32 overflow in our bound reasoning makes a test panic instead of
# silently wrapping.
[profile.test]
opt-level = 2
