name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable (MSVC) with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -vV
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      # Fails if a division appears in mlkem code, or a conditional branch in
      # a leaf constant-time function, at any optimisation level.
      - name: Constant-time assembly check
        shell: pwsh
        run: ./scripts/asm-check.ps1 -SkipShowAsm
