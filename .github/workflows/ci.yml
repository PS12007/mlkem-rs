name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable (MSVC) with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -vV
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      # Fails if a division appears in mlkem code, or a conditional branch in
      # a leaf constant-time function, at any optimisation level.
      - name: Constant-time assembly check
        shell: pwsh
        run: ./scripts/asm-check.ps1 -SkipShowAsm
      # WebAssembly (phase 7): the same constant-time rules on the wasm32
      # instructions (with a positive control that must be caught), and all
      # ACVP vectors run against the .wasm module in Node (preinstalled on
      # the runner).
      - name: Install the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Constant-time instruction check (WebAssembly)
        shell: pwsh
        run: ./scripts/wasm-check.ps1
      - name: ACVP vectors in WebAssembly (Node)
        run: |
          cargo build --release -p mlkem-wasm --target wasm32-unknown-unknown
          node scripts/wasm/acvp.mjs target/wasm32-unknown-unknown/release/mlkem_wasm.wasm
