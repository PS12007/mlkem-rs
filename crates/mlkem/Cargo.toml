[package]
name = "mlkem"
version = "0.1.0"
description = "Educational from-scratch ML-KEM (NIST FIPS 203). NOT audited. Do not use in production."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# No runtime dependencies, on purpose: every piece of arithmetic and hashing
# in this crate is written by hand. Crates under [dev-dependencies] are only
# compiled for tests, benchmarks and examples, never into the library.
[dependencies]

[dev-dependencies]
keccak = "0.1"
ml-kem = "0.3.3"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
sha3 = "0.10"
